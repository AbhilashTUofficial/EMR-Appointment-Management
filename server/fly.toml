# Deploy from the repository root: fly deploy --config server/fly.toml
app = "FLY_APP"
primary_region = "bom" # Mumbai, next to the Atlas cluster

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  TRUST_PROXY = "2" # Vercel, then Fly's proxy
  # CLIENT_ORIGIN, MONGODB_URI and the JWT secrets are set with `fly secrets set`.

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off" # live connections must not be dropped when idle
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
