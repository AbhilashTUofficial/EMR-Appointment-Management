# Local demo: MongoDB, the API and the web app on http://localhost:8080.
# Copy .env.example to .env and fill it in first.
services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # "development" so the demo seed script is allowed to run and cookies work over plain http.
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/emr_appointments
      CLIENT_ORIGIN: http://localhost:8080
      TRUST_PROXY: 1
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      - mongo

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo-data:
